name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Inspect main version
    if: github.event_name == 'push'
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare the push's before and after commits
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          SOURCE: ${{ github.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ((git rev-parse HEAD) -cne $env:SOURCE) { throw 'Unexpected checkout' }
          if ($env:BEFORE -cnotmatch '^[0-9a-f]{40}$') { throw 'Missing prior main SHA' }
          git merge-base --is-ancestor $env:BEFORE $env:SOURCE
          . .\installer\release-policy.ps1
          $plan = Get-KeyDockReleasePlan $env:BEFORE $env:SOURCE
          "version=$($plan.Version)" >> $env:GITHUB_OUTPUT
          "changed=$($plan.Changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build:
    name: Verify source and packages
    needs: version
    if: |
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.version.result == 'success')
    uses: ./.github/workflows/ci.yml
    with:
      candidate: ${{ github.event_name == 'workflow_dispatch' || needs.version.outputs.changed == 'true' }}

  publish:
    name: Publish verified x64 release
    needs: [version, build]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected &&
      needs.version.outputs.changed == 'true' && needs.build.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 15
    concurrency:
      group: keydock-release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: keydock-x64-candidate
          path: dist
      - name: Tag and publish the exact validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          .\installer\publish-release.ps1 -Before $env:BEFORE -Version $env:VERSION -Directory dist
